name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy ta python-dotenv mypy
      - name: Lint (syntax)
        run: python -m py_compile project risk_model.py fvg_detector.py fvg_utils.py crt_patterns.py
      - name: Type check
        run: mypy --ignore-missing-imports risk_model.py
      - name: Run tests
        run: pytest -q
